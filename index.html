<!DOCTYPE html>
<html lang="ko">
<head>

    <style>
        /* 접속 대기 화면 디자인 (깔끔하게) */

        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h3 { color: #333; margin: 0; }
        p { color: #666; font-size: 14px; margin-top: 10px; }
    </style>
</head>

    <script>

            window.location.href = "https://github.com/drewkorea-cloud/hoimyung-app/blob/main/logo.png";
        }, 100);
